behaviors:
  FlyingAgent:
    trainer_type: ppo

    keep_checkpoints: 2
    checkpoint_interval: 500000

    hyperparameters:
      batch_size: 2048
      buffer_size: 20480
      learning_rate: 3.0e-4
      beta: 5.0e-4
      epsilon: 0.2
      lambd: 0.99
      num_epoch: 3
      learning_rate_schedule: linear
      beta_schedule: constant
      epsilon_schedule: linear

    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 3

    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
        
    max_steps: 20000000
    time_horizon: 256
    summary_freq: 10000

environment_parameters:

  starting_velocity:
    curriculum:
