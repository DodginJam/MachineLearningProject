behaviors:
  Tracker:
    trainer_type: ppo
    hyperparameters:
      batch_size: 1024
      buffer_size: 100000
      learning_rate: 3.0e-4
      beta: 5.0e-4
      epsilon: 0.2
      lambd: 0.99
      num_epoch: 3
      learning_rate_schedule: linear
      beta_schedule: constant
      epsilon_schedule: linear
    network_settings:
      normalize: false
      hidden_units: 128
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    max_steps: 50000000
    time_horizon: 256
    summary_freq: 10000

environment_parameters:

  movement_multiplier:
    curriculum:
      - name: easy
        completion_criteria:
          measure: reward
          behavior: Tracker
          threshold: 0.3
          min_lesson_length: 1000
        value: 0.5

      - name: medium
        completion_criteria:
          measure: reward
          behavior: Tracker
          threshold: 0.5
          min_lesson_length: 1000
          require_reset: true
        value: 2.0

      - name: hard
        value: 5.0


  number_of_targets:
    curriculum:
      - name: easy
        completion_criteria:
          measure: reward
          behavior: Tracker
          threshold: 0.65
          min_lesson_length: 1000
        value: 1

      - name: medium
        completion_criteria:
          measure: reward
          behavior: Tracker
          threshold: 0.8
          min_lesson_length: 1000
          require_reset: true
        value: 5

      - name: hard
        value: 20


  friendly_ratio:
    curriculum:
      - name: easy
        completion_criteria:
          measure: reward
          behavior: Tracker
          threshold: 0.85
          min_lesson_length: 1000
        value: 0.0

      - name: medium
        completion_criteria:
          measure: reward
          behavior: Tracker
          threshold: 0.95
          min_lesson_length: 1000
          require_reset: true
        value: 0.2

      - name: hard
        value: 0.4

  size_of_target:
    curriculum:
      - name: easy
        completion_criteria:
          measure: reward
          behavior: Tracker
          threshold: 0.4
          min_lesson_length: 1000
        value: 15

      - name: medium
        completion_criteria:
          measure: reward
          behavior: Tracker
          threshold: 0.6
          min_lesson_length: 1000
          require_reset: true
        value: 10

      - name: hard
        value: 5

  blind_fire_penalty:
    curriculum:
    - name: easy
      completion_criteria:
        measure: reward
        behavior: Tracker
        threshold: 0.7
        min_lesson_length: 1000
        require_reset: true
      value: 0.0

    - name: medium
      completion_criteria:
        measure: reward
        behavior: Tracker
        threshold: 0.85
        min_lesson_length: 1000
        require_reset: true
      value: -0.001

    - name: hard
      value: -0.005